# /etc/rc.conf - Roteador do Trabalho 02
# Validar: sh -n /etc/rc.conf   Aplicar: shutdown -r now

hostname="roteador"

# --- Interfaces ---
# WAN: porta de rede da propria Pi (muge0), IP entregue pela rede de acesso
ifconfig_ue0="DHCP"
# LAN: adaptador USB TP-Link (ure0), gateway da rede 10.10.0.0/16
ifconfig_ue1="inet 10.10.0.1/16"

# Laboratorio com IP fixo: comente ifconfig_ue0="DHCP" e use
# ifconfig_ue0="inet 192.168.X.Y/24"
# defaultrouter="192.168.X.1"

# --- Repasse ---
# Liga net.inet.ip.forwarding: a Pi passa pacotes entre ue0 e ue1
gateway_enable="YES"

# --- Servicos ---
sshd_enable="YES"
dnsmasq_enable="YES"
pf_enable="YES"
pflog_enable="YES"

# --- Sistema (padroes da imagem RPI) ---
# Sem bateria, a hora vem do NTP a cada boot
ntpd_enable="YES"
ntpd_sync_on_start="YES"
growfs_enable="YES"
powerd_enable="YES"
sendmail_enable="NONE"
