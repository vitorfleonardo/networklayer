# /usr/local/etc/dnsmasq.conf - DHCP da LAN do Trabalho 02
# Validar: dnsmasq --test   Aplicar: service dnsmasq restart

# Somente DHCP: o DNS fica com o servidor da rede de acesso
port=0
# Atende apenas a LAN
interface=ue1
# Unico servidor DHCP desta rede
dhcp-authoritative

# Faixa dinamica, mascara /16, concessao de 12 horas
dhcp-range=10.10.0.100,10.10.0.200,255.255.0.0,12h
# Gateway entregue aos clientes
dhcp-option=option:router,10.10.0.1

# DNS entregue aos clientes (deixe apenas uma linha ativa)
# Laboratorio: servidores indicados pelo professor
dhcp-option=option:dns-server,164.41.101.4,164.41.101.11
# Laboratorio, se o professor indicar o gateway da rede de acesso:
# dhcp-option=option:dns-server,192.168.X.1
# Em casa: IP do Deco, a linha "default" de netstat -rn -f inet
# dhcp-option=option:dns-server,IP_DO_DECO

# IP fixo da maquina de testes, alvo do DNAT no pf.conf.
# Um MAC por host (Mac, Windows, Linux); todos recebem 10.10.0.10,
# desde que so um esteja ligado a LAN por vez.
dhcp-host=18:4a:53:14:de:6d,maquina-teste,10.10.0.10
# Com os tres hosts, troque a linha acima por:
# dhcp-host=18:4a:53:14:de:6d,MAC_WINDOWS,MAC_LINUX,maquina-teste,10.10.0.10

# Registro das concessoes
dhcp-leasefile=/var/db/dnsmasq.leases
log-dhcp
log-facility=/var/log/dnsmasq.log
