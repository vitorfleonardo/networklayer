# /etc/pf.conf - Roteador do Trabalho 02
# Validar: pfctl -nf /etc/pf.conf   Recarregar: pfctl -f /etc/pf.conf

# --- Macros ---
ext_if = "ue0"
int_if = "ue1"
lan_net = "10.10.0.0/16"
servidor_lan = "10.10.0.10"

# --- Opcoes ---
set skip on lo0

# --- Traducao ---
# NAT: o que sai da LAN pela WAN usa o IP da WAN
nat on $ext_if inet from $lan_net to any -> ($ext_if)
# DNAT: a porta 80 da WAN vai para a 8080 da maquina de testes
rdr on $ext_if inet proto tcp from any to ($ext_if) port 80 tag DNAT -> $servidor_lan port 8080

# --- Filtragem ---
# Opcional: bloqueia ping da LAN para fora do segmento
# block in quick log on $int_if inet proto icmp from $lan_net to ! $lan_net icmp-type echoreq

# LAN: tudo passa
pass in on $int_if all
pass out on $int_if all

# WAN: nada entra, exceto o liberado abaixo
block in on $ext_if all
pass in on $ext_if inet proto udp from any port 67 to any port 68
pass in on $ext_if inet proto tcp from any to ($ext_if) port 22
pass in on $ext_if inet proto icmp from any to ($ext_if) icmp-type echoreq
# Somente pacotes marcados pelo rdr chegam a LAN
pass in on $ext_if inet proto tcp tagged DNAT

# Saida pela WAN liberada; as respostas voltam pelo estado
pass out on $ext_if all
