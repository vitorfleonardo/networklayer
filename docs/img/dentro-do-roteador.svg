<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" role="img" aria-labelledby="t">
<title id="t">Arquitetura de um roteador (Kurose, Fig. 4.4) mapeada na Raspberry Pi</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.s{font-size:12px;fill:#57606a}.c{text-anchor:middle}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.3}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.3}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.wh{fill:#fff;stroke:#8c959f;stroke-width:1.2}
.ar{stroke:#57606a;stroke-width:1.8;fill:none;marker-end:url(#a)}
.dash{stroke:#8250df;stroke-width:1.5;stroke-dasharray:6 4;fill:none;marker-end:url(#p)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#57606a"/></marker>
<marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#8250df"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<text x="20" y="40" class="b">Plano de controle</text>
<text x="20" y="58" class="s">software · milissegundos</text>
<rect x="300" y="22" width="300" height="84" rx="10" class="rt"/>
<text x="450" y="46" class="c b">Processador de roteamento</text>
<text x="450" y="66" class="c s">CPU ARM da Pi · kernel FreeBSD</text>
<text x="450" y="84" class="c s">monta a tabela; roda dnsmasq e sshd</text>
<line x1="20" y1="132" x2="880" y2="132" stroke="#d0d7de" stroke-dasharray="4 4"/>
<path d="M450,106V146H247V174" class="dash"/>
<text x="262" y="140" class="s" style="fill:#8250df">cópia da tabela de repasse</text>
<text x="20" y="390" class="b">Plano de dados</text>

<!-- entradas -->
<text x="20" y="168" class="b" font-size="13">ue0 · entrada</text>
<rect x="20" y="178" width="80" height="58" rx="5" class="wan"/><text x="60" y="202" class="c s">terminação</text><text x="60" y="218" class="c s">de linha</text>
<rect x="105" y="178" width="85" height="58" rx="5" class="wan"/><text x="147" y="202" class="c s">enlace</text><text x="147" y="218" class="c s">desencapsula</text>
<rect x="195" y="178" width="105" height="58" rx="5" class="wan"/><text x="247" y="202" class="c s">consulta,</text><text x="247" y="218" class="c s">repasse e fila</text>
<text x="20" y="278" class="b" font-size="13">ue1 · entrada</text>
<rect x="20" y="288" width="80" height="58" rx="5" class="lan"/><text x="60" y="312" class="c s">terminação</text><text x="60" y="328" class="c s">de linha</text>
<rect x="105" y="288" width="85" height="58" rx="5" class="lan"/><text x="147" y="312" class="c s">enlace</text><text x="147" y="328" class="c s">desencapsula</text>
<rect x="195" y="288" width="105" height="58" rx="5" class="lan"/><text x="247" y="312" class="c s">consulta,</text><text x="247" y="328" class="c s">repasse e fila</text>

<!-- comutação -->
<line x1="300" y1="207" x2="348" y2="207" class="ar"/>
<line x1="300" y1="317" x2="348" y2="317" class="ar"/>
<rect x="350" y="178" width="200" height="168" rx="10" class="rt"/>
<text x="450" y="210" class="c b">Elemento de comutação</text>
<text x="450" y="236" class="c s">comutação via memória:</text>
<text x="450" y="254" class="c s">a CPU copia o pacote da</text>
<text x="450" y="272" class="c s">entrada para a saída</text>
<text x="450" y="306" class="c s">vazão máxima &lt; B/2</text>
<text x="450" y="324" class="c s">(Kurose, p. 317)</text>
<line x1="550" y1="207" x2="598" y2="207" class="ar"/>
<line x1="550" y1="317" x2="598" y2="317" class="ar"/>

<!-- saídas -->
<text x="600" y="168" class="b" font-size="13">ue0 · saída</text>
<rect x="600" y="178" width="105" height="58" rx="5" class="wan"/><text x="652" y="202" class="c s">fila</text><text x="652" y="218" class="c s">(buffer)</text>
<rect x="710" y="178" width="85" height="58" rx="5" class="wan"/><text x="752" y="202" class="c s">enlace</text><text x="752" y="218" class="c s">encapsula</text>
<rect x="800" y="178" width="80" height="58" rx="5" class="wan"/><text x="840" y="202" class="c s">terminação</text><text x="840" y="218" class="c s">de linha</text>
<text x="600" y="278" class="b" font-size="13">ue1 · saída</text>
<rect x="600" y="288" width="105" height="58" rx="5" class="lan"/><text x="652" y="312" class="c s">fila</text><text x="652" y="328" class="c s">(buffer)</text>
<rect x="710" y="288" width="85" height="58" rx="5" class="lan"/><text x="752" y="312" class="c s">enlace</text><text x="752" y="328" class="c s">encapsula</text>
<rect x="800" y="288" width="80" height="58" rx="5" class="lan"/><text x="840" y="312" class="c s">terminação</text><text x="840" y="328" class="c s">de linha</text>

<text x="150" y="390" class="s">Na Pi, ue0 (muge) e ue1 (ure) são placas no mesmo barramento USB 2.0; consulta, cópia e filas são feitas em software.</text>
</svg>
