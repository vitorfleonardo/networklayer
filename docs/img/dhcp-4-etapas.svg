<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="t">
<title id="t">As quatro etapas do DHCP entre o host da LAN e o dnsmasq da Pi</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12.5px;fill:#57606a}
.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
.life{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 5}
.ar{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2328"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>

<rect x="60" y="20" width="220" height="58" rx="8" class="lan"/>
<text x="170" y="44" class="c b">Host LAN</text>
<text x="170" y="64" class="c s">ainda sem IP: usa 0.0.0.0</text>
<rect x="620" y="20" width="220" height="58" rx="8" class="rt"/>
<text x="730" y="44" class="c b">dnsmasq na Pi</text>
<text x="730" y="64" class="c s">ue1 · 10.10.0.1, porta 67</text>
<line x1="170" y1="78" x2="170" y2="385" class="life"/>
<line x1="730" y1="78" x2="730" y2="385" class="life"/>

<text x="190" y="117" class="b">1 · Descoberta (DHCPDISCOVER)</text>
<text x="190" y="135" class="m">0.0.0.0:68 → 255.255.255.255:67 · quadro para FF:FF:FF:FF:FF:FF</text>
<line x1="172" y1="146" x2="726" y2="146" class="ar"/>

<text x="710" y="187" class="b" text-anchor="end">2 · Oferta (DHCPOFFER)</text>
<text x="710" y="205" class="m" text-anchor="end">10.10.0.1:67 → cliente:68 · oferece 10.10.0.10 por 12 h</text>
<line x1="728" y1="216" x2="174" y2="216" class="ar"/>

<text x="190" y="257" class="b">3 · Solicitação (DHCPREQUEST)</text>
<text x="190" y="275" class="m">0.0.0.0:68 → 255.255.255.255:67 · aceita a oferta</text>
<line x1="172" y1="286" x2="726" y2="286" class="ar"/>

<text x="710" y="327" class="b" text-anchor="end">4 · Confirmação (DHCPACK)</text>
<text x="710" y="345" class="m" text-anchor="end">IP 10.10.0.10 · máscara /16 · gateway 10.10.0.1 · DNS · 12 h</text>
<line x1="728" y1="356" x2="174" y2="356" class="ar"/>

<text x="20" y="412" class="s">Tudo vai em UDP sobre IP sobre Ethernet. Cada etapa aparece em /var/log/dnsmasq.log; a concessão final fica em /var/db/dnsmasq.leases.</text>
</svg>
