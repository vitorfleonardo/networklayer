<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img" aria-labelledby="t">
<title id="t">DNAT: a porta 80 da WAN chega à 8080 da LAN; uma tentativa direta, sem passar pelo rdr, é bloqueada</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.bad{fill:#ffebe9;stroke:#cf222e;stroke-width:1.5}
.ar{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#a)}.arr{stroke:#cf222e;stroke-width:1.8;fill:none;marker-end:url(#r)}
.red{fill:#cf222e}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2328"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#cf222e"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>

<text x="20" y="26" class="b">Pelo DNAT: liberado</text>
<rect x="20" y="60" width="170" height="70" rx="8" class="wan"/>
<text x="105" y="88" class="c b">Máquina WAN</text>
<text x="105" y="108" class="c m">192.168.X.20</text>
<rect x="360" y="40" width="230" height="130" rx="12" class="rt"/>
<text x="475" y="66" class="c b">Pi (pf)</text>
<text x="475" y="92" class="c m">rdr :80 → 10.10.0.10:8080</text>
<text x="475" y="112" class="c m">tag DNAT</text>
<text x="475" y="138" class="c m">pass in … tagged DNAT</text>
<rect x="760" y="60" width="160" height="70" rx="8" class="lan"/>
<text x="840" y="88" class="c b">Host LAN</text>
<text x="840" y="108" class="c m">nc -lk 8080</text>

<line x1="190" y1="100" x2="356" y2="100" class="ar"/>
<text x="200" y="70" class="m">S 192.168.X.20:53000</text>
<text x="200" y="88" class="m">D 192.168.X.Y:80</text>
<line x1="590" y1="100" x2="756" y2="100" class="ar"/>
<text x="598" y="70" class="m">S 192.168.X.20:53000</text>
<text x="598" y="88" class="m">D 10.10.0.10:8080</text>
<text x="470" y="196" class="c s">A origem é preservada. A resposta volta pela Pi (gateway da LAN) e o estado desfaz a troca: a WAN vê 192.168.X.Y:80.</text>

<line x1="20" y1="218" x2="920" y2="218" stroke="#d0d7de"/>

<text x="20" y="246" class="b">Direto, com rota forçada: bloqueado (teste de isolamento)</text>
<rect x="20" y="280" width="170" height="70" rx="8" class="wan"/>
<text x="105" y="308" class="c b">Máquina WAN</text>
<text x="105" y="328" class="c s">rota 10.10.0.0/16 via Pi</text>
<rect x="360" y="265" width="230" height="100" rx="12" class="bad"/>
<text x="475" y="292" class="c b">Pi (pf)</text>
<text x="475" y="316" class="c s">não passou pelo rdr → sem tag</text>
<text x="475" y="340" class="c m">block in on ue0 all</text>
<rect x="760" y="280" width="160" height="70" rx="8" class="lan" opacity=".55"/>
<text x="840" y="308" class="c b">Host LAN</text>
<text x="840" y="328" class="c s">nada chega</text>

<line x1="190" y1="315" x2="356" y2="315" class="arr"/>
<text x="200" y="300" class="m">D 10.10.0.10:8080</text>
<line x1="590" y1="315" x2="756" y2="315" stroke="#cf222e" stroke-width="1.8" stroke-dasharray="6 5"/>
<path d="M663,303L687,327M687,303L663,327" stroke="#cf222e" stroke-width="3"/>
<text x="20" y="388" class="s">Sem a tag, uma regra que liberasse qualquer pacote para 10.10.0.10:8080 deixaria esse caminho aberto.</text>
</svg>
