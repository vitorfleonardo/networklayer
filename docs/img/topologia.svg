<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t">
<title id="t">Topologia do trabalho: rede de acesso (WAN), Raspberry Pi como roteador e LAN 10.10.0.0/16</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.h{font-size:16px;font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}.e{text-anchor:end}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.wh{fill:#fff;stroke:#8c959f;stroke-width:1.2}
.ln{stroke:#57606a;stroke-width:2;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>

<!-- WAN -->
<rect x="20" y="60" width="290" height="300" rx="12" class="wan" fill-opacity=".5"/>
<text x="40" y="88" class="h">Rede de acesso (WAN)</text>
<text x="40" y="108" class="s">192.168.X.0/24</text>
<rect x="50" y="125" width="230" height="44" rx="22" class="wh"/>
<text x="165" y="152" class="c b">Internet</text>
<line x1="165" y1="169" x2="165" y2="200" class="ln"/>
<rect x="50" y="200" width="230" height="56" rx="8" class="wh"/>
<text x="165" y="224" class="c">Gateway do laboratório</text>
<text x="165" y="244" class="c s">192.168.X.1</text>
<rect x="50" y="285" width="230" height="56" rx="8" class="wh"/>
<text x="165" y="309" class="c">Máquina WAN</text>
<text x="165" y="329" class="c s">cliente dos testes de DNAT</text>
<path d="M280,228H320M280,313H320M320,206V313" class="ln"/>

<!-- Pi -->
<line x1="320" y1="206" x2="375" y2="206" class="ln"/>
<text x="338" y="196" class="c s">cabo 1</text>
<rect x="360" y="110" width="280" height="270" rx="14" class="rt"/>
<text x="500" y="140" class="c h">Raspberry Pi 3B+</text>
<text x="500" y="160" class="c s">FreeBSD 15.1</text>
<rect x="375" y="180" width="70" height="52" rx="6" class="wan"/>
<text x="410" y="203" class="c b">ue0</text>
<text x="410" y="221" class="c s">WAN</text>
<rect x="555" y="180" width="70" height="52" rx="6" class="lan"/>
<text x="590" y="203" class="c b">ue1</text>
<text x="590" y="221" class="c s">LAN</text>
<line x1="452" y1="206" x2="548" y2="206" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="500" y="196" class="c s">repasse</text>
<text x="410" y="250" class="c s">192.168.X.Y</text>
<text x="590" y="250" class="c s">10.10.0.1/16</text>
<rect x="400" y="265" width="200" height="28" rx="6" class="wh"/>
<text x="500" y="284" class="c">pf · NAT, DNAT, filtro</text>
<rect x="400" y="299" width="200" height="28" rx="6" class="wh"/>
<text x="500" y="318" class="c">dnsmasq · DHCP</text>
<rect x="400" y="333" width="200" height="28" rx="6" class="wh"/>
<text x="500" y="352" class="c">sshd · administração</text>

<!-- LAN -->
<rect x="680" y="60" width="260" height="300" rx="12" class="lan" fill-opacity=".5"/>
<text x="700" y="88" class="h">LAN (rede privada)</text>
<text x="700" y="108" class="s">10.10.0.0/16</text>
<path d="M625,206H700M700,185V288M700,185H720M700,288H720" class="ln"/>
<text x="652" y="196" class="c s">cabo 2</text>
<rect x="720" y="150" width="200" height="72" rx="8" class="wh"/>
<text x="820" y="174" class="c">Máquina de testes</text>
<text x="820" y="194" class="c s">10.10.0.10 · reserva DHCP</text>
<text x="820" y="212" class="c s">servidor TCP :8080</text>
<rect x="720" y="260" width="200" height="56" rx="8" class="wh"/>
<text x="820" y="284" class="c">Outros clientes</text>
<text x="820" y="304" class="c s">10.10.0.100 a 10.10.0.200</text>

<text x="20" y="402" class="s">Saída (NAT): a origem 10.10.0.x vira 192.168.X.Y</text>
<text x="940" y="402" class="s e">Entrada (DNAT): 192.168.X.Y:80 → 10.10.0.10:8080</text>
</svg>
