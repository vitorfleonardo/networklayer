<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t">
<title id="t">Endereço 10.10.0.10/16: prefixo de rede, parte de host, máscara e uso dos endereços da LAN</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.h{font-size:16px;font-weight:600}.s{font-size:12px;fill:#57606a}.c{text-anchor:middle}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.3}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.3}
.nat{fill:#fbefff;stroke:#8250df;stroke-width:1.5}.wh{fill:#fff;stroke:#8c959f;stroke-width:1.2}.nt{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2}
</style>
<rect width="100%" height="100%" fill="#fff"/>

<text x="450" y="34" class="c h">10.10.0.10/16</text>
<rect x="40" y="50" width="410" height="50" rx="6" class="nat"/>
<rect x="450" y="50" width="410" height="50" rx="6" class="lan"/>
<text x="245" y="72" class="c b">prefixo de rede · 16 bits</text>
<text x="245" y="91" class="c m">10.10</text>
<text x="655" y="72" class="c b">identificador do host · 16 bits</text>
<text x="655" y="91" class="c m">0.10</text>
<text x="450" y="128" class="c m">máscara 255.255.0.0 = 11111111.11111111.00000000.00000000</text>

<rect x="40" y="150" width="128" height="58" rx="6" class="nt"/>
<text x="104" y="174" class="c m">10.10.0.0</text><text x="104" y="194" class="c s">endereço da rede</text>
<rect x="176" y="150" width="128" height="58" rx="6" class="lan"/>
<text x="240" y="174" class="c m">10.10.0.1</text><text x="240" y="194" class="c s">gateway (ue1)</text>
<rect x="312" y="150" width="128" height="58" rx="6" class="lan"/>
<text x="376" y="174" class="c m">10.10.0.10</text><text x="376" y="194" class="c s">reserva · alvo DNAT</text>
<rect x="448" y="150" width="136" height="58" rx="6" class="lan"/>
<text x="516" y="174" class="c m">.0.100 a .0.200</text><text x="516" y="194" class="c s">faixa dinâmica</text>
<rect x="592" y="150" width="128" height="58" rx="6" class="wh"/>
<text x="656" y="174" class="c m">…</text><text x="656" y="194" class="c s">livres</text>
<rect x="728" y="150" width="132" height="58" rx="6" class="nt"/>
<text x="794" y="174" class="c m">10.10.255.255</text><text x="794" y="194" class="c s">difusão da sub-rede</text>
<text x="450" y="236" class="c s">2^16 = 65.536 endereços; tirando rede e difusão, 65.534 para interfaces</text>

<line x1="40" y1="258" x2="860" y2="258" stroke="#d0d7de"/>
<text x="40" y="301" class="b">Blocos privados</text>
<text x="40" y="319" class="s">RFC 1918</text>
<rect x="190" y="282" width="210" height="34" rx="6" class="lan"/>
<text x="295" y="304" class="c"><tspan class="m">10.0.0.0/8</tspan> · nossa LAN</text>
<rect x="410" y="282" width="150" height="34" rx="6" class="nt"/>
<text x="485" y="304" class="c m">172.16.0.0/12</text>
<rect x="570" y="282" width="290" height="34" rx="6" class="wan"/>
<text x="715" y="304" class="c"><tspan class="m">192.168.0.0/16</tspan> · já contém a WAN</text>
</svg>
