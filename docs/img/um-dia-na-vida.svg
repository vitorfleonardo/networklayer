<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="960" height="790" role="img" aria-labelledby="t">
<title id="t">Um dia na vida de uma requisição web, refeito na nossa rede (Kurose, §6.7)</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px}
.p{fill:#8250df}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}
.band{fill:#f6f8fa}.bt{font-size:13px;font-weight:600;fill:#57606a}
.life{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:5 5}
.ar{stroke:#1f2328;stroke-width:1.6;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2328"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>

<!-- participantes -->
<rect x="30" y="20" width="160" height="56" rx="8" class="lan"/>
<text x="110" y="43" class="c b">Host LAN</text><text x="110" y="63" class="c m">10.10.0.10</text>
<rect x="310" y="20" width="180" height="56" rx="8" class="rt"/>
<text x="400" y="43" class="c b">Raspberry Pi</text><text x="400" y="63" class="c s">DHCP · repasse · NAT</text>
<rect x="600" y="20" width="160" height="56" rx="8" class="wan"/>
<text x="680" y="43" class="c b">Servidor DNS</text><text x="680" y="63" class="c m">164.41.101.4</text>
<rect x="790" y="20" width="160" height="56" rx="8" class="wan"/>
<text x="870" y="43" class="c b">Servidor web</text><text x="870" y="63" class="c m">www.freebsd.org</text>
<line x1="110" y1="76" x2="110" y2="765" class="life"/>
<line x1="400" y1="76" x2="400" y2="765" class="life"/>
<line x1="680" y1="76" x2="680" y2="765" class="life"/>
<line x1="870" y1="76" x2="870" y2="765" class="life"/>

<!-- faixas -->
<rect x="10" y="95" width="940" height="24" class="band"/><text x="20" y="112" class="bt">A · DHCP, UDP, IP e Ethernet (§6.7.1)</text>
<rect x="10" y="275" width="940" height="24" class="band"/><text x="20" y="292" class="bt">B · ARP: o MAC do gateway (§6.7.2)</text>
<rect x="10" y="387" width="940" height="24" class="band"/><text x="20" y="404" class="bt">C · DNS atravessando o NAT (§6.7.2 e §6.7.3)</text>
<rect x="10" y="499" width="940" height="24" class="band"/><text x="20" y="516" class="bt">D · TCP: apresentação de três vias (§6.7.4)</text>
<rect x="10" y="645" width="940" height="24" class="band"/><text x="20" y="662" class="bt">E · HTTP: pedido e resposta (§6.7.4)</text>

<!-- A -->
<text x="122" y="142" class="m">DHCPDISCOVER · 0.0.0.0 → 255.255.255.255</text>
<line x1="112" y1="150" x2="396" y2="150" class="ar"/>
<text x="122" y="176" class="m">DHCPOFFER · 10.10.0.10</text>
<line x1="398" y1="184" x2="114" y2="184" class="ar"/>
<text x="122" y="210" class="m">DHCPREQUEST</text>
<line x1="112" y1="218" x2="396" y2="218" class="ar"/>
<text x="122" y="244" class="m">DHCPACK · /16, gateway, DNS</text>
<line x1="398" y1="252" x2="114" y2="252" class="ar"/>

<!-- B -->
<text x="122" y="322" class="m">quem tem 10.10.0.1? (difusão)</text>
<line x1="112" y1="330" x2="396" y2="330" class="ar"/>
<text x="122" y="356" class="m">10.10.0.1 está no MAC da ue1</text>
<line x1="398" y1="364" x2="114" y2="364" class="ar"/>

<!-- C -->
<text x="122" y="434" class="m">UDP 53 · S 10.10.0.10</text>
<text x="412" y="434" class="m p">S 192.168.X.Y (NAT)</text>
<line x1="112" y1="442" x2="676" y2="442" class="ar"/>
<circle cx="400" cy="442" r="6" class="p"/>
<text x="412" y="468" class="m">IP de www.freebsd.org</text>
<text x="122" y="468" class="m p">D 10.10.0.10 (NAT desfeito)</text>
<line x1="678" y1="476" x2="114" y2="476" class="ar"/>
<circle cx="400" cy="476" r="6" class="p"/>

<!-- D -->
<text x="122" y="546" class="m">SYN · S 10.10.0.10:51000</text>
<text x="412" y="546" class="m p">S 192.168.X.Y:50123 · pf cria o estado</text>
<line x1="112" y1="554" x2="866" y2="554" class="ar"/>
<circle cx="400" cy="554" r="6" class="p"/>
<text x="412" y="580" class="m">SYN-ACK · D 192.168.X.Y:50123</text>
<text x="122" y="580" class="m p">D 10.10.0.10:51000</text>
<line x1="868" y1="588" x2="114" y2="588" class="ar"/>
<circle cx="400" cy="588" r="6" class="p"/>
<text x="122" y="614" class="m">ACK</text>
<line x1="112" y1="622" x2="866" y2="622" class="ar"/>
<circle cx="400" cy="622" r="6" class="p"/>

<!-- E -->
<text x="122" y="692" class="m">GET / HTTP/1.1 · Host: www.freebsd.org</text>
<line x1="112" y1="700" x2="866" y2="700" class="ar"/>
<circle cx="400" cy="700" r="6" class="p"/>
<text x="412" y="726" class="m">HTTP/1.1 301 + cabeçalhos</text>
<line x1="868" y1="734" x2="114" y2="734" class="ar"/>
<circle cx="400" cy="734" r="6" class="p"/>

<circle cx="30" cy="779" r="6" class="p"/>
<text x="44" y="784" class="s">o pf traduz o pacote ao atravessar a Pi (troca a origem na ida e o destino na volta)</text>
</svg>
