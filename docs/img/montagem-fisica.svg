<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-labelledby="t">
<title id="t">Montagem física: o que ligar em quê, na ordem numerada</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.h{font-size:16px;font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.wh{fill:#fff;stroke:#8c959f;stroke-width:1.2}
.ln{stroke:#57606a;stroke-width:3;fill:none}.n{fill:#bc4c00;stroke:#fff;stroke-width:2}.nt{fill:#fff;font-size:13px;font-weight:700;text-anchor:middle}
</style>
<rect width="100%" height="100%" fill="#fff"/>

<rect x="20" y="95" width="190" height="66" rx="8" class="wan"/>
<text x="115" y="122" class="c b">Rede de acesso</text>
<text x="115" y="143" class="c s">laboratório ou Deco</text>

<rect x="300" y="60" width="280" height="200" rx="12" class="rt"/>
<text x="440" y="92" class="c h">Raspberry Pi 3B+</text>
<text x="440" y="113" class="c s">microSD com FreeBSD</text>
<rect x="306" y="135" width="74" height="42" rx="5" class="wh"/>
<text x="343" y="153" class="c b" font-size="13">RJ45</text>
<text x="343" y="169" class="c s">ue0</text>
<rect x="500" y="135" width="74" height="42" rx="5" class="wh"/>
<text x="537" y="161" class="c b" font-size="13">USB</text>

<rect x="600" y="135" width="115" height="42" rx="6" class="lan"/>
<text x="657" y="153" class="c b" font-size="13">TP-Link USB</text>
<text x="657" y="169" class="c s">ure0 = ue1</text>
<line x1="574" y1="156" x2="600" y2="156" class="ln"/>

<rect x="740" y="95" width="145" height="66" rx="8" class="lan"/>
<text x="812" y="122" class="c b">Host LAN</text>
<text x="812" y="143" class="c s">Mac, Windows, Linux</text>

<path d="M210,128H255V156H306" class="ln"/>
<path d="M715,156H727V128H740" class="ln"/>

<rect x="310" y="295" width="120" height="52" rx="8" class="wh"/>
<text x="370" y="317" class="c b">Fonte 5 V</text>
<text x="370" y="335" class="c s">micro-USB</text>
<rect x="450" y="295" width="160" height="52" rx="8" class="wh"/>
<text x="530" y="317" class="c b">Monitor + teclado</text>
<text x="530" y="335" class="c s">HDMI e USB, opcional</text>
<line x1="370" y1="260" x2="370" y2="295" class="ln"/>
<line x1="530" y1="260" x2="530" y2="295" class="ln"/>

<circle cx="255" cy="142" r="13" class="n"/><text x="255" y="147" class="nt">1</text>
<circle cx="587" cy="128" r="13" class="n"/><text x="587" y="133" class="nt">2</text>
<circle cx="727" cy="142" r="13" class="n"/><text x="727" y="147" class="nt">3</text>
<circle cx="530" cy="278" r="13" class="n"/><text x="530" y="283" class="nt">4</text>
<circle cx="370" cy="278" r="13" class="n"/><text x="370" y="283" class="nt">5</text>

<text x="660" y="300" class="b" font-size="13">Ordem</text>
<text x="660" y="318" class="s">1 cabo da WAN · 2 adaptador</text>
<text x="660" y="335" class="s">3 cabo da LAN · 4 monitor</text>
<text x="660" y="352" class="s">5 fonte por último</text>
<text x="20" y="352" class="s">Esquema lógico: na placa, o RJ45 e as USB</text>
<text x="20" y="367" class="s">ficam na mesma borda.</text>
</svg>
