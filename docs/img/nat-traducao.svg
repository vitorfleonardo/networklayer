<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img" aria-labelledby="t">
<title id="t">NAT: conexão iniciada na LAN, reescrita da origem e tabela de tradução (Kurose, Fig. 4.25, na nossa rede)</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#1f2328;font-size:14px}
.b{font-weight:600}.s{font-size:12.5px;fill:#57606a}.c{text-anchor:middle}
.m{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:12px}
.wan{fill:#ddf4ff;stroke:#0969da;stroke-width:1.5}.lan{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.5}
.rt{fill:#fff1e5;stroke:#bc4c00;stroke-width:1.5}.nat{fill:#fbefff;stroke:#8250df;stroke-width:1.5}
.ar{stroke:#1f2328;stroke-width:1.8;fill:none;marker-end:url(#a)}
.n{fill:#8250df}.nt{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f2328"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>

<text x="105" y="40" class="c b">LAN</text>
<text x="470" y="40" class="c b">Roteador</text>
<text x="835" y="40" class="c b">WAN e Internet</text>

<rect x="20" y="150" width="170" height="70" rx="8" class="lan"/>
<text x="105" y="178" class="c b">Host LAN</text>
<text x="105" y="198" class="c m">10.10.0.10</text>

<rect x="350" y="110" width="240" height="150" rx="12" class="rt"/>
<text x="470" y="140" class="c b">Pi com NAT (pf)</text>
<text x="362" y="245" class="s">ue1</text>
<text x="578" y="245" class="s" text-anchor="end">ue0 · 192.168.X.Y</text>
<text x="470" y="180" class="c s">troca a origem na ida</text>
<text x="470" y="198" class="c s">e o destino na volta</text>

<rect x="750" y="150" width="170" height="70" rx="8" class="wan"/>
<text x="835" y="178" class="c b">Servidor web</text>
<text x="835" y="198" class="c m">203.0.113.80</text>

<line x1="190" y1="172" x2="346" y2="172" class="ar"/>
<line x1="590" y1="172" x2="746" y2="172" class="ar"/>
<line x1="750" y1="200" x2="594" y2="200" class="ar"/>
<line x1="350" y1="200" x2="194" y2="200" class="ar"/>

<circle cx="200" cy="110" r="10" class="n"/><text x="200" y="114" class="nt">1</text>
<text x="215" y="138" class="m">S 10.10.0.10:51000</text>
<text x="215" y="156" class="m">D 203.0.113.80:80</text>
<circle cx="600" cy="110" r="10" class="n"/><text x="600" y="114" class="nt">2</text>
<text x="600" y="138" class="m">S 192.168.X.Y:50123</text>
<text x="600" y="156" class="m">D 203.0.113.80:80</text>
<circle cx="610" cy="260" r="10" class="n"/><text x="610" y="264" class="nt">3</text>
<text x="600" y="222" class="m">S 203.0.113.80:80</text>
<text x="600" y="240" class="m">D 192.168.X.Y:50123</text>
<circle cx="210" cy="260" r="10" class="n"/><text x="210" y="264" class="nt">4</text>
<text x="200" y="222" class="m">S 203.0.113.80:80</text>
<text x="200" y="240" class="m">D 10.10.0.10:51000</text>

<line x1="470" y1="260" x2="470" y2="298" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="290" y="298" width="360" height="104" rx="8" class="nat"/>
<text x="470" y="322" class="c b">Tabela de tradução NAT (estados do pf)</text>
<text x="380" y="346" class="c s">lado WAN</text>
<text x="560" y="346" class="c s">lado LAN</text>
<line x1="305" y1="354" x2="635" y2="354" stroke="#c297ff"/>
<text x="380" y="378" class="c m">192.168.X.Y:50123</text>
<text x="560" y="378" class="c m">10.10.0.10:51000</text>

<text x="20" y="300" class="s">1 sai da LAN com origem privada</text>
<text x="20" y="318" class="s">2 deixa a Pi com o IP e uma porta da WAN</text>
<text x="670" y="300" class="s">3 a resposta volta ao IP da WAN</text>
<text x="670" y="318" class="s">4 a tabela devolve ao host certo</text>
</svg>
